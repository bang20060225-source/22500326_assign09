<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서 관리 | My Bookshelf</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">📚 My Bookshelf</a>
    <nav>
      <a href="index.html">홈</a>
      <a href="crud.html" class="active">도서 관리</a>
    </nav>
  </header>

  <main class="container">
    <!-- 성공/실패 메시지 영역 -->
    <div id="message" class="message" role="status" hidden></div>

    <!-- 등록/수정 Form (같은 폼을 모드만 바꿔서 사용) -->
    <section class="card">
      <h2 id="formTitle">새 도서 등록</h2>
      <form id="bookForm" novalidate>
        <input type="hidden" id="bookId">

        <div class="form-grid">
          <label>제목 *
            <input id="title" type="text" maxlength="50" placeholder="예: 데미안">
          </label>

          <label>저자 *
            <input id="author" type="text" maxlength="30" placeholder="예: 헤르만 헤세">
          </label>

          <label>장르 *
            <select id="genre">
              <option value="">장르 선택</option>
              <option>소설</option>
              <option>에세이</option>
              <option>자기계발</option>
              <option>과학</option>
              <option>IT</option>
              <option>역사</option>
              <option>기타</option>
            </select>
          </label>

          <label>출판연도 *
            <input id="year" type="number" placeholder="예: 1919">
          </label>

          <label>평점 (1~5) *
            <input id="rating" type="number" min="1" max="5" step="1" placeholder="1~5">
          </label>

          <label class="check">
            <input id="isRead" type="checkbox"> 다 읽은 책
          </label>
        </div>

        <div class="actions">
          <button type="submit" id="submitBtn" class="btn primary">등록</button>
          <button type="button" id="cancelBtn" class="btn" hidden>수정 취소</button>
        </div>
      </form>
    </section>

    <!-- 목록 + 검색 -->
    <section class="card">
      <div class="list-header">
        <h2>도서 목록 <span id="count" class="count"></span></h2>
        <div class="search">
          <input id="searchInput" type="search" placeholder="제목 또는 저자 검색">
          <select id="genreFilter">
            <option value="">전체 장르</option>
            <option>소설</option>
            <option>에세이</option>
            <option>자기계발</option>
            <option>과학</option>
            <option>IT</option>
            <option>역사</option>
            <option>기타</option>
          </select>
          <button type="button" id="reloadBtn" class="btn">↻ 새로고침</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>제목</th>
              <th>저자</th>
              <th>장르</th>
              <th>출판연도</th>
              <th>평점</th>
              <th>상태</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="bookList"></tbody>
        </table>
      </div>
      <p id="emptyText" class="empty" hidden></p>
    </section>
  </main>

  <footer class="footer">Open Source Studio · Week Assignment · Fetch API + MockAPI CRUD</footer>

  <script src="js/app.js"></script>
</body>
</html>
